server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: placement-system-backend
  profiles:
    active: dev

  # Default datasource: H2 for zero-configuration instant startup,
  # or can switch to mysql by setting spring.profiles.active=mysql
  datasource:
    url: jdbc:h2:mem:placement_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: 9a6e8b4c7d2e1f5a8b3c6d9e2f4a7b1c5d8e0f3a6b9c2d5e8f1a4b7c0d3e6f9
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: ./uploads/resumes

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/placement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
